<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding-bottom: 70px; }
        .header { background: #fff; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .container { padding: 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .btn { background: #4a90e2; color: white; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 8px; font-size: 15px; }
        .btn:active { background: #357abd; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eee; }
        .nav-item { cursor: pointer; text-align: center; font-size: 12px; color: #666; }
        .nav-item.active { color: #4a90e2; font-weight: bold; }
        .streak-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
        .streak-day { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 8px; text-align: center; font-size: 12px; }
        .streak-day.current { background: #e3f2fd; border-color: #4a90e2; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">🥛 Молочная Ферма Telegram</div>

<div class="container">
    <!-- Главная -->
    <div id="tab-home" class="tab-content active">
        <div class="card">
            <h3>Баланс: <span id="balance">0</span> 🥛</h3>
            <p>Уютная ежедневная награда (7 дней):</p>
            <div class="streak-grid" id="streakContainer"></div>
            <button class="btn" onclick="sendAction('daily_reward')">Забрать награду дня</button>
            <button class="btn" style="background: #e67e22;" onclick="sendAction('watch_ad')">📺 Смотреть рекламу (+5 🥛)</button>
        </div>
    </div>

    <!-- Рынок -->
    <div id="tab-market" class="tab-content">
        <div class="card">
            <h3>🛒 Рынок и Бусты</h3>
            <button class="btn" onclick="buyBoost('x2_milk')">⚡ Буст: x2 молока на час (50 🥛)</button>
            <button class="btn" style="background: #27ae60;" onclick="buyBoost('auto_milker')">🤖 Авто-дойка (150 🥛)</button>
        </div>
    </div>

    <!-- Профиль -->
    <div id="tab-profile" class="tab-content">
        <div class="card">
            <h3>👤 Профиль</h3>
            <p>Кошелек: <span id="walletStatus">Не подключен</span></p>
            <button class="btn" style="background: #9b59b6;" onclick="connectWallet()">👛 Подключить ТГ-кошелек</button>
            <hr style="margin: 15px 0; border:0; border-top:1px solid #eee;">
            <h3>💱 Финансы и Курсы</h3>
            <p style="font-size: 14px;">100 🥛 = 1 Telegram Star ⭐</p>
            <p style="font-size: 14px;">50 🥛 = 1 GRAM 💎</p>
            <button class="btn" style="background: #27ae60;" onclick="topUp()">Пополнить (Stars / TON)</button>
            <button class="btn" style="background: #c0392b;" onclick="withdraw()">Вывод на ТГ-кошелек</button>
        </div>
    </div>
</div>

<div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('home', this)">🏠 Главная</div>
    <div class="nav-item" onclick="switchTab('market', this)">🛒 Рынок</div>
    <div class="nav-item" onclick="switchTab('profile', this)">👤 Профиль</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "test_user_iphone";
    const rewards = {1: 5, 2: 10, 3: 20, 4: 30, 5: 40, 6: 50, 7: 70};

    function renderStreak(currentDay) {
        const container = document.getElementById('streakContainer');
        container.innerHTML = '';
        for (let day = 1; day <= 7; day++) {
            let isCurrent = (day === currentDay) ? ' current' : '';
            container.innerHTML += `<div class="streak-day${isCurrent}">Д${day}<br><b>${rewards[day]}🥛</b></div>`;
        }
    }

    async function apiRequest(action, extraData = {}) {
        try {
            let res = await fetch('/api/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action, telegram_id: userId, ...extraData })
            });
            return await res.json();
        } catch (e) {
            console.error(e);
            return null;
        }
    }

    async function loadUserData() {
        let data = await apiRequest('get_user');
        if (data) {
            document.getElementById('balance').innerText = data.milk_balance;
            renderStreak(data.streak_day);
            if (data.wallet_address) {
                document.getElementById('walletStatus').innerText = data.wallet_address;
            }
        }
    }

    async function sendAction(actionType) {
        let data = await apiRequest(actionType);
        if (data && data.success) {
            document.getElementById('balance').innerText = data.new_balance;
            if (data.next_streak) renderStreak(data.next_streak);
            tg.showAlert(actionType === 'daily_reward' ? `Получено ${data.reward} 🥛!` : `+5 🥛 зачислено!`);
        } else if (data && data.error) {
            tg.showAlert(data.error);
        }
    }

    function switchTab(tabName, element) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        element.classList.add('active');
    }

    function connectWallet() {
        tg.showConfirm("Подключить Telegram Wallet?", async (ok) => {
            if (ok) {
                let wallet = "TON: EQD...Connected";
                let data = await apiRequest('update_wallet', { wallet_address: wallet });
                if (data && data.success) {
                    document.getElementById('walletStatus').innerText = wallet;
                    tg.showAlert("Кошелек успешно привязан!");
                }
            }
        });
    }

    function topUp() { tg.showAlert("Пополнение через Telegram Stars ⭐ или TON"); }
    function withdraw() { tg.showAlert("Запрос на вывод отправлен на кошелек"); }
    function buyBoost(type) { tg.showAlert("Буст успешно куплен: " + type); }

    loadUserData();
</script>
</body>
</html>
